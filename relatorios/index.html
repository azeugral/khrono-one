<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatórios do mês — Khrono</title>
<meta name="description" content="Relatórios financeiros mensais do Khrono: faturamento por profissional, comissões, recebimentos, serviços, faltas e fechamento do mês.">
<meta name="theme-color" content="#f1f3ef">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="slogo" href="../"><img src="../assets/img/brand/horizontal-light.svg" alt="Khrono" width="1328" height="387"></a>
    <span class="lb">Relatórios</span>
    <nav id="nav">
      <button class="on" data-r="profissional">Faturamento por profissional</button>
      <button data-r="comissoes">Comissões a pagar</button>
      <button data-r="recebimentos">Recebimentos por forma</button>
      <button data-r="caixa">Caixa diário</button>
      <button data-r="servicos">Serviços realizados</button>
      <button data-r="clientes">Clientes e retorno</button>
      <button data-r="faltas">Faltas e cancelamentos</button>
      <button data-r="assinaturas">Assinaturas e pacotes</button>
      <button data-r="resumo">Resumo do mês</button>
    </nav>
    <div class="sfoot">Modelos de demonstração · dados fictícios<br><a href="https://azeugral.github.io/khrono-painel/">Painel</a> · <a href="../">Site</a></div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="ib burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="ttl"><small>Fechamento mensal</small><b id="tTitle">Faturamento por profissional</b></div>
      <div class="tools">
        <label class="sel"><span>Competência</span><select id="fMes"></select></label>
        <label class="sel"><span>Unidade</span><select id="fUni"><option>Todas as unidades</option><option selected>Studio Aurora — Pinheiros</option><option>Studio Aurora — Vila Mariana</option></select></label>
        <button class="btn" id="csv"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>CSV</button>
        <button class="btn acc" id="print"><svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 19H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 15h10v6H7z"/></svg>Imprimir / PDF</button>
      </div>
    </header>
    <div class="paper" id="paper"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
